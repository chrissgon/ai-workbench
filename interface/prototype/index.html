<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbench, 2D isometric prototype</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l12 7v12l-12 7-12-7V10z' fill='%232f6bff'/%3E%3Cpath d='M16 3l12 7-12 7-12-7z' fill='%238fb0ff'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="breadcrumbs"></div>
      <div id="kpis"></div>
      <a id="controlbtn" class="btn" href="#/control">Control room</a>
    </header>
    <main id="view" aria-live="polite"></main>
    <footer id="trackbar" class="hidden"></footer>
    <aside id="sidepanel" aria-label="Details"></aside>
    <div id="tooltip" role="tooltip"></div>
    <div id="toast" role="status"></div>
    <div id="fatal" hidden></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
