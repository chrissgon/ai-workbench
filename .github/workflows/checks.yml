# The same checks as .githooks/pre-commit, for every push to main and every pull request.
# Actions are pinned to a commit (tags can move); Dependabot proposes updates.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history scan reads every commit
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Conventions and security scan
        run: python3 scripts/validate.py
      - name: Secrets in history
        run: python3 scripts/security_scan.py --history

  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: Scanner and provider tests
        run: uv run --with pytest==9.1.1 pytest -q scripts/tests providers/publisher/tests providers/scheduler/tests providers/vcs/tests providers/secrets/tests providers/mailbox/tests providers/store/tests adapters/agents-dir/tests adapters/claude-code/tests skills/core-skill-creator/scripts/tests
